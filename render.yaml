services:
  - type: web
    name: wincleaner-license-service
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    plan: free
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wincleaner-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: WinCleanerLicense_Bot
      - key: ADMIN_SECRET
        generateValue: true
      - key: ADMIN_IDS
        sync: false
      - key: ED25519_PRIVATE_KEY_HEX
        sync: false
      - key: ED25519_PUBLIC_KEY_HEX
        sync: false

databases:
  - name: wincleaner-db
    plan: free
    region: frankfurt
